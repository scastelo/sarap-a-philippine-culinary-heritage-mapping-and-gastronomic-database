<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kain — Philippine Culinary Heritage Atlas</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;1,400&family=DM+Mono:wght@300;400&family=Libre+Baskerville:ital@0;1&display=swap" rel="stylesheet">
<style>
  :root {
    --ink: #1a1208;
    --parch: #f5eed8;
    --parch2: #ede4c8;
    --rust: #b84a20;
    --ochre: #c8882a;
    --forest: #2d5a3d;
    --sea: #1e4a6e;
    --turmeric: #d4a017;
    --smoke: #6b5f4a;
    --cream: #faf6ec;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: 'DM Mono', monospace;
    background: var(--parch);
    color: var(--ink);
    min-height: 100vh;
  }

  /* ── HEADER ── */
  header {
    background: var(--ink);
    color: var(--parch);
    padding: 0 48px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    height: 64px;
    position: sticky;
    top: 0;
    z-index: 100;
    border-bottom: 3px solid var(--rust);
  }

  .logo {
    font-family: 'Playfair Display', serif;
    font-size: 2rem;
    font-style: italic;
    letter-spacing: -1px;
    color: var(--parch);
  }

  .logo span {
    color: var(--ochre);
    font-style: normal;
  }

  nav { display: flex; gap: 32px; }
  nav button {
    background: none;
    border: none;
    color: var(--parch);
    font-family: 'DM Mono', monospace;
    font-size: 0.7rem;
    letter-spacing: 2px;
    text-transform: uppercase;
    cursor: pointer;
    opacity: 0.6;
    padding: 4px 0;
    border-bottom: 1px solid transparent;
    transition: all 0.2s;
  }
  nav button:hover, nav button.active {
    opacity: 1;
    border-bottom-color: var(--ochre);
    color: var(--ochre);
  }

  /* ── MAIN LAYOUT ── */
  .app { display: flex; height: calc(100vh - 64px); overflow: hidden; }

  /* ── SIDEBAR ── */
  .sidebar {
    width: 340px;
    min-width: 340px;
    background: var(--cream);
    border-right: 2px solid var(--parch2);
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }

  .sidebar-header {
    padding: 24px 24px 16px;
    border-bottom: 1px solid var(--parch2);
  }

  .sidebar-header h2 {
    font-family: 'Playfair Display', serif;
    font-size: 1rem;
    font-weight: 400;
    color: var(--smoke);
    letter-spacing: 1px;
    text-transform: uppercase;
    margin-bottom: 12px;
  }

  .search-box {
    width: 100%;
    padding: 10px 14px;
    border: 1.5px solid var(--parch2);
    background: var(--parch);
    font-family: 'DM Mono', monospace;
    font-size: 0.78rem;
    color: var(--ink);
    border-radius: 2px;
    outline: none;
    transition: border-color 0.2s;
  }
  .search-box:focus { border-color: var(--rust); }
  .search-box::placeholder { color: var(--smoke); opacity: 0.5; }

  .filter-row {
    display: flex;
    gap: 6px;
    margin-top: 10px;
    flex-wrap: wrap;
  }

  .filter-chip {
    padding: 4px 10px;
    border: 1.5px solid var(--parch2);
    background: transparent;
    font-family: 'DM Mono', monospace;
    font-size: 0.65rem;
    letter-spacing: 1px;
    text-transform: uppercase;
    cursor: pointer;
    border-radius: 2px;
    color: var(--smoke);
    transition: all 0.15s;
  }
  .filter-chip:hover { border-color: var(--rust); color: var(--rust); }
  .filter-chip.active { background: var(--rust); border-color: var(--rust); color: white; }

  .dish-list {
    flex: 1;
    overflow-y: auto;
    padding: 8px 0;
  }

  .dish-item {
    padding: 16px 24px;
    cursor: pointer;
    border-bottom: 1px solid var(--parch2);
    transition: background 0.15s;
    position: relative;
  }
  .dish-item:hover { background: var(--parch); }
  .dish-item.active { background: var(--parch); border-left: 3px solid var(--rust); padding-left: 21px; }

  .dish-name {
    font-family: 'Playfair Display', serif;
    font-size: 1rem;
    font-weight: 700;
    color: var(--ink);
    margin-bottom: 2px;
  }

  .dish-region {
    font-size: 0.65rem;
    letter-spacing: 2px;
    text-transform: uppercase;
    color: var(--smoke);
    margin-bottom: 6px;
  }

  .flavor-dots {
    display: flex;
    gap: 4px;
    align-items: center;
  }

  .flavor-dot {
    width: 8px;
    height: 8px;
    border-radius: 50%;
  }

  .dot-label {
    font-size: 0.58rem;
    color: var(--smoke);
    margin-left: 4px;
  }

  .season-badge {
    display: inline-block;
    padding: 2px 7px;
    font-size: 0.58rem;
    letter-spacing: 1px;
    text-transform: uppercase;
    border-radius: 20px;
    margin-top: 6px;
  }

  /* ── MAIN CONTENT ── */
  .main {
    flex: 1;
    overflow-y: auto;
    background: var(--parch);
  }

  /* ── VIEWS ── */
  .view { display: none; }
  .view.active { display: block; }

  /* ── DISH DETAIL ── */
  .detail-hero {
    background: var(--ink);
    color: var(--parch);
    padding: 48px 56px 40px;
    position: relative;
    overflow: hidden;
  }

  .detail-hero::before {
    content: '';
    position: absolute;
    top: -40px; right: -40px;
    width: 300px; height: 300px;
    border-radius: 50%;
    background: var(--rust);
    opacity: 0.12;
  }

  .detail-hero::after {
    content: '';
    position: absolute;
    bottom: -60px; left: 200px;
    width: 200px; height: 200px;
    border-radius: 50%;
    background: var(--turmeric);
    opacity: 0.08;
  }

  .breadcrumb {
    font-size: 0.65rem;
    letter-spacing: 2px;
    text-transform: uppercase;
    color: var(--smoke);
    margin-bottom: 16px;
  }

  .detail-title {
    font-family: 'Playfair Display', serif;
    font-size: 3.2rem;
    font-weight: 700;
    line-height: 1.05;
    margin-bottom: 8px;
  }

  .detail-subtitle {
    font-family: 'Libre Baskerville', serif;
    font-style: italic;
    font-size: 1.05rem;
    color: var(--ochre);
    margin-bottom: 24px;
  }

  .detail-tags {
    display: flex;
    gap: 10px;
    flex-wrap: wrap;
  }

  .tag {
    padding: 5px 14px;
    border: 1px solid rgba(245,238,216,0.3);
    font-size: 0.65rem;
    letter-spacing: 2px;
    text-transform: uppercase;
    border-radius: 2px;
  }

  .detail-body {
    padding: 40px 56px;
  }

  .detail-grid {
    display: grid;
    grid-template-columns: 1.6fr 1fr;
    gap: 40px;
    margin-bottom: 40px;
  }

  .section-label {
    font-size: 0.62rem;
    letter-spacing: 3px;
    text-transform: uppercase;
    color: var(--rust);
    margin-bottom: 12px;
    font-weight: 400;
  }

  .history-text {
    font-family: 'Libre Baskerville', serif;
    font-size: 0.95rem;
    line-height: 1.8;
    color: var(--ink);
  }

  .info-card {
    background: var(--cream);
    border: 1.5px solid var(--parch2);
    padding: 24px;
    border-radius: 2px;
  }

  .info-row {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    padding: 10px 0;
    border-bottom: 1px solid var(--parch2);
    font-size: 0.78rem;
  }

  .info-row:last-child { border-bottom: none; }
  .info-key { color: var(--smoke); }
  .info-val { font-weight: 400; text-align: right; max-width: 60%; }

  /* ── FLAVOR RADAR ── */
  .flavor-section {
    margin-bottom: 40px;
  }

  .flavor-grid {
    display: grid;
    grid-template-columns: repeat(6, 1fr);
    gap: 10px;
  }

  .flavor-bar-item { }

  .flavor-bar-label {
    font-size: 0.6rem;
    letter-spacing: 1px;
    text-transform: uppercase;
    color: var(--smoke);
    margin-bottom: 6px;
  }

  .flavor-bar-track {
    height: 6px;
    background: var(--parch2);
    border-radius: 3px;
    overflow: hidden;
  }

  .flavor-bar-fill {
    height: 100%;
    border-radius: 3px;
    transition: width 0.6s ease;
  }

  /* ── INGREDIENTS ── */
  .ingredients-grid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 12px;
    margin-bottom: 40px;
  }

  .ingredient-card {
    background: var(--cream);
    border: 1.5px solid var(--parch2);
    padding: 14px 16px;
    border-radius: 2px;
    display: flex;
    gap: 10px;
    align-items: flex-start;
  }

  .ingredient-icon { font-size: 1.4rem; }

  .ingredient-name {
    font-family: 'Playfair Display', serif;
    font-size: 0.85rem;
    font-weight: 700;
    margin-bottom: 2px;
  }

  .ingredient-meta {
    font-size: 0.65rem;
    color: var(--smoke);
    line-height: 1.5;
  }

  .ingredient-endemic {
    display: inline-block;
    font-size: 0.55rem;
    letter-spacing: 1px;
    text-transform: uppercase;
    padding: 2px 6px;
    background: var(--forest);
    color: white;
    border-radius: 2px;
    margin-top: 4px;
  }

  /* ── COMMUNITIES ── */
  .communities-list {
    display: flex;
    flex-direction: column;
    gap: 12px;
    margin-bottom: 40px;
  }

  .community-card {
    background: var(--cream);
    border: 1.5px solid var(--parch2);
    padding: 18px 20px;
    border-radius: 2px;
    display: flex;
    justify-content: space-between;
    align-items: center;
  }

  .community-name {
    font-family: 'Playfair Display', serif;
    font-size: 0.95rem;
    font-weight: 700;
    margin-bottom: 3px;
  }

  .community-detail { font-size: 0.72rem; color: var(--smoke); }

  .tradition-score {
    font-family: 'Playfair Display', serif;
    font-size: 1.8rem;
    font-weight: 700;
    color: var(--rust);
  }

  .tradition-label {
    font-size: 0.58rem;
    letter-spacing: 1px;
    text-transform: uppercase;
    color: var(--smoke);
    text-align: center;
  }

  /* ── MATCHING ENGINE ── */
  .match-section {
    border-top: 2px solid var(--ink);
    padding-top: 40px;
    margin-bottom: 40px;
  }

  .match-header {
    display: flex;
    justify-content: space-between;
    align-items: flex-end;
    margin-bottom: 24px;
  }

  .match-title {
    font-family: 'Playfair Display', serif;
    font-size: 1.6rem;
    font-weight: 700;
  }

  .match-subtitle {
    font-size: 0.72rem;
    color: var(--smoke);
    margin-top: 4px;
  }

  .match-cards {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 16px;
  }

  .match-card {
    background: var(--ink);
    color: var(--parch);
    padding: 24px;
    border-radius: 2px;
    cursor: pointer;
    transition: transform 0.2s, background 0.2s;
    position: relative;
    overflow: hidden;
  }

  .match-card::before {
    content: '';
    position: absolute;
    top: 0; left: 0; right: 0;
    height: 3px;
    background: var(--rust);
  }

  .match-card:hover { transform: translateY(-3px); }

  .match-score {
    font-family: 'Playfair Display', serif;
    font-size: 2.4rem;
    font-weight: 700;
    color: var(--ochre);
    line-height: 1;
    margin-bottom: 4px;
  }

  .match-pct { font-size: 0.9rem; }

  .match-dish {
    font-family: 'Playfair Display', serif;
    font-size: 1.1rem;
    font-weight: 700;
    margin: 10px 0 4px;
  }

  .match-region-tag {
    font-size: 0.6rem;
    letter-spacing: 2px;
    text-transform: uppercase;
    color: var(--smoke);
    margin-bottom: 10px;
  }

  .match-reason {
    font-size: 0.7rem;
    line-height: 1.6;
    color: rgba(245,238,216,0.7);
  }

  .match-flavors {
    display: flex;
    gap: 5px;
    margin-top: 12px;
    flex-wrap: wrap;
  }

  .match-flavor-tag {
    padding: 2px 8px;
    background: rgba(245,238,216,0.1);
    border: 1px solid rgba(245,238,216,0.2);
    font-size: 0.6rem;
    letter-spacing: 1px;
    text-transform: uppercase;
    border-radius: 20px;
  }

  /* ── MAP VIEW ── */
  .map-container {
    padding: 40px 56px;
  }

  .map-header {
    margin-bottom: 32px;
  }

  .map-title {
    font-family: 'Playfair Display', serif;
    font-size: 2rem;
    font-weight: 700;
    margin-bottom: 6px;
  }

  .ph-map {
    background: var(--cream);
    border: 1.5px solid var(--parch2);
    border-radius: 2px;
    padding: 24px;
    margin-bottom: 32px;
  }

  .region-grid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 16px;
  }

  .region-card {
    background: var(--cream);
    border: 1.5px solid var(--parch2);
    padding: 20px;
    border-radius: 2px;
    cursor: pointer;
    transition: all 0.2s;
    border-top: 3px solid transparent;
  }

  .region-card:hover { border-top-color: var(--rust); transform: translateY(-2px); box-shadow: 0 4px 20px rgba(26,18,8,0.1); }

  .region-name {
    font-family: 'Playfair Display', serif;
    font-size: 1.05rem;
    font-weight: 700;
    margin-bottom: 4px;
  }

  .region-cluster {
    font-size: 0.62rem;
    letter-spacing: 2px;
    text-transform: uppercase;
    color: var(--rust);
    margin-bottom: 10px;
  }

  .region-stats {
    display: flex;
    gap: 16px;
  }

  .region-stat {
    font-size: 0.7rem;
    color: var(--smoke);
  }

  .region-stat strong {
    display: block;
    font-family: 'Playfair Display', serif;
    font-size: 1.3rem;
    color: var(--ink);
    font-weight: 700;
  }

  /* ── ITINERARY VIEW ── */
  .itinerary-container {
    padding: 40px 56px;
  }

  .itinerary-builder {
    background: var(--cream);
    border: 1.5px solid var(--parch2);
    padding: 32px;
    border-radius: 2px;
    margin-bottom: 32px;
  }

  .builder-title {
    font-family: 'Playfair Display', serif;
    font-size: 1.4rem;
    font-weight: 700;
    margin-bottom: 20px;
  }

  .pref-grid {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 16px;
    margin-bottom: 20px;
  }

  .pref-group label {
    display: block;
    font-size: 0.62rem;
    letter-spacing: 2px;
    text-transform: uppercase;
    color: var(--smoke);
    margin-bottom: 8px;
  }

  .pref-select {
    width: 100%;
    padding: 10px 14px;
    border: 1.5px solid var(--parch2);
    background: var(--parch);
    font-family: 'DM Mono', monospace;
    font-size: 0.78rem;
    color: var(--ink);
    border-radius: 2px;
    outline: none;
    cursor: pointer;
    -webkit-appearance: none;
  }

  .flavor-pref-grid {
    display: grid;
    grid-template-columns: repeat(6, 1fr);
    gap: 8px;
    margin-bottom: 20px;
  }

  .flavor-toggle {
    padding: 8px;
    border: 1.5px solid var(--parch2);
    background: transparent;
    font-family: 'DM Mono', monospace;
    font-size: 0.62rem;
    letter-spacing: 1px;
    text-transform: uppercase;
    cursor: pointer;
    border-radius: 2px;
    text-align: center;
    transition: all 0.15s;
    color: var(--smoke);
  }

  .flavor-toggle:hover { border-color: var(--ochre); color: var(--ochre); }
  .flavor-toggle.active { background: var(--ochre); border-color: var(--ochre); color: white; }

  .generate-btn {
    padding: 14px 32px;
    background: var(--rust);
    color: white;
    border: none;
    font-family: 'DM Mono', monospace;
    font-size: 0.72rem;
    letter-spacing: 2px;
    text-transform: uppercase;
    cursor: pointer;
    border-radius: 2px;
    transition: background 0.2s;
  }

  .generate-btn:hover { background: var(--ink); }

  .itinerary-output {
    display: none;
  }

  .itinerary-output.visible { display: block; }

  .itinerary-header {
    display: flex;
    justify-content: space-between;
    align-items: flex-end;
    margin-bottom: 24px;
  }

  .itinerary-title {
    font-family: 'Playfair Display', serif;
    font-size: 2rem;
    font-weight: 700;
    line-height: 1.1;
  }

  .itinerary-meta {
    font-size: 0.72rem;
    color: var(--smoke);
    margin-top: 6px;
  }

  .route-days {
    display: flex;
    flex-direction: column;
    gap: 0;
  }

  .route-day {
    display: flex;
    gap: 0;
  }

  .route-day-num {
    width: 80px;
    min-width: 80px;
    padding: 20px 0;
    text-align: center;
    position: relative;
  }

  .route-day-num::after {
    content: '';
    position: absolute;
    top: 0; bottom: 0;
    right: 0;
    width: 2px;
    background: var(--parch2);
  }

  .route-day-num .day-n {
    font-family: 'Playfair Display', serif;
    font-size: 1.8rem;
    font-weight: 700;
    color: var(--rust);
    display: block;
    line-height: 1;
  }

  .route-day-num .day-label {
    font-size: 0.55rem;
    letter-spacing: 2px;
    text-transform: uppercase;
    color: var(--smoke);
  }

  .route-day-dot {
    position: absolute;
    right: -6px;
    top: 24px;
    width: 10px;
    height: 10px;
    border-radius: 50%;
    background: var(--rust);
    z-index: 1;
  }

  .route-day-content {
    flex: 1;
    padding: 20px 0 20px 32px;
    border-bottom: 1px solid var(--parch2);
  }

  .route-location {
    font-family: 'Playfair Display', serif;
    font-size: 1.1rem;
    font-weight: 700;
    margin-bottom: 4px;
  }

  .route-region-tag {
    font-size: 0.62rem;
    letter-spacing: 2px;
    text-transform: uppercase;
    color: var(--rust);
    margin-bottom: 12px;
  }

  .route-dishes {
    display: flex;
    gap: 10px;
    flex-wrap: wrap;
  }

  .route-dish-pill {
    padding: 6px 14px;
    background: var(--cream);
    border: 1.5px solid var(--parch2);
    font-size: 0.72rem;
    border-radius: 20px;
    font-family: 'Playfair Display', serif;
  }

  .route-note {
    margin-top: 10px;
    font-size: 0.72rem;
    color: var(--smoke);
    font-family: 'Libre Baskerville', serif;
    font-style: italic;
    line-height: 1.6;
  }

  /* ── SCROLLBAR ── */
  ::-webkit-scrollbar { width: 6px; }
  ::-webkit-scrollbar-track { background: var(--parch2); }
  ::-webkit-scrollbar-thumb { background: var(--smoke); border-radius: 3px; }

  /* ── UTILITIES ── */
  .mt-8 { margin-top: 8px; }
  .mt-16 { margin-top: 16px; }
  .mt-24 { margin-top: 24px; }
  .mt-32 { margin-top: 32px; }

  .empty-state {
    padding: 80px 40px;
    text-align: center;
  }

  .empty-icon {
    font-size: 3rem;
    margin-bottom: 16px;
    opacity: 0.3;
  }

  .empty-text {
    font-family: 'Libre Baskerville', serif;
    font-style: italic;
    color: var(--smoke);
    font-size: 1rem;
    line-height: 1.7;
  }

  .seasonal-bar {
    display: flex;
    gap: 3px;
    margin-top: 8px;
  }

  .month-block {
    flex: 1;
    height: 16px;
    border-radius: 2px;
    position: relative;
  }

  .month-block-label {
    position: absolute;
    bottom: -16px;
    left: 50%;
    transform: translateX(-50%);
    font-size: 0.5rem;
    letter-spacing: 0.5px;
    text-transform: uppercase;
    color: var(--smoke);
    white-space: nowrap;
  }

  .seasonal-wrap {
    padding-bottom: 24px;
    margin-bottom: 8px;
  }
</style>
</head>
<body>

<header>
  <div class="logo">Kain<span>.</span>ph</div>
  <nav>
    <button class="active" onclick="switchNav(this, 'dishes')">Dish Database</button>
    <button onclick="switchNav(this, 'regions')">Regional Atlas</button>
    <button onclick="switchNav(this, 'itinerary')">Itinerary Builder</button>
  </nav>
</header>

<div class="app">

  <!-- SIDEBAR -->
  <aside class="sidebar">
    <div class="sidebar-header">
      <h2>Dishes</h2>
      <input class="search-box" type="text" placeholder="Search dishes, regions, ingredients…" oninput="filterDishes(this.value)" id="searchInput">
      <div class="filter-row" id="filterRow">
        <button class="filter-chip active" onclick="filterByRegion(this, 'all')">All</button>
        <button class="filter-chip" onclick="filterByRegion(this, 'Luzon')">Luzon</button>
        <button class="filter-chip" onclick="filterByRegion(this, 'Visayas')">Visayas</button>

function init() {
  renderDishList(DISHES);
  renderRegionGrid();
}

// ── NAVIGATION ────────────────────────────────────────────────────────────

function switchNav(btn, view) {
  document.querySelectorAll('nav button').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  document.querySelectorAll('.view').forEach(v => v.classList.remove('active'));
  document.getElementById('view-' + view).classList.add('active');
}

// ── DISH LIST ─────────────────────────────────────────────────────────────

function renderDishList(dishes) {
  const list = document.getElementById('dishList');
  if (!dishes.length) {
    list.innerHTML = `<div style="padding:32px;text-align:center;color:var(--smoke);font-size:0.78rem;">No dishes found.</div>`;
    return;
  }
  list.innerHTML = dishes.map(d => {
    const topFlavors = Object.entries(d.flavor_profile)
      .sort((a,b) => b[1]-a[1]).slice(0,3);
    return `
      <div class="dish-item ${currentDish?.id === d.id ? 'active' : ''}" onclick="selectDish('${d.id}')">
        <div class="dish-name">${d.name}</div>
        <div class="dish-region">${d.region}</div>
        <div class="flavor-dots">
          ${topFlavors.map(([f,v]) => `
            <div class="flavor-dot" style="background:${FLAVORS[f].color};opacity:${0.3 + v*0.07}" title="${FLAVORS[f].label}: ${v}/10"></div>
          `).join('')}
          <span class="dot-label">${topFlavors.map(([f]) => FLAVORS[f].label).join(' · ')}</span>
        </div>
        <div>
          <span class="season-badge" style="background:${d.cluster === 'Luzon' ? '#b84a2022' : d.cluster === 'Visayas' ? '#c8882a22' : '#1e4a6e22'};color:${d.cluster === 'Luzon' ? '#b84a20' : d.cluster === 'Visayas' ? '#c8882a' : '#1e4a6e'}">${d.cluster}</span>
        </div>
      </div>
    `;
  }).join('');
}

function filterDishes(q) {
  currentSearch = q.toLowerCase();
  applyFilters();
}

function filterByRegion(btn, cluster) {
  document.querySelectorAll('.filter-chip').forEach(c => c.classList.remove('active'));
  btn.classList.add('active');
  currentFilter = cluster;
  applyFilters();
}

function applyFilters() {
  let result = DISHES;
  if (currentFilter !== 'all') result = result.filter(d => d.cluster === currentFilter);
  if (currentSearch) result = result.filter(d =>
    d.name.toLowerCase().includes(currentSearch) ||
    d.region.toLowerCase().includes(currentSearch) ||
    d.local_name.toLowerCase().includes(currentSearch) ||
    d.ingredients.some(i => i.name.toLowerCase().includes(currentSearch))
  );
  renderDishList(result);
}

// ── DISH DETAIL ───────────────────────────────────────────────────────────

function selectDish(id) {
  currentDish = DISHES.find(d => d.id === id);
  document.querySelectorAll('.dish-item').forEach(el => el.classList.remove('active'));
  document.querySelectorAll('.dish-item').forEach(el => {
    if (el.onclick.toString().includes(id)) el.classList.add('active');
  });
  renderDishDetail(currentDish);

  // Switch to dish view
  document.querySelectorAll('.view').forEach(v => v.classList.remove('active'));
  document.getElementById('view-dishes').classList.add('active');
  document.querySelectorAll('nav button').forEach((b,i) => { if(i===0) b.classList.add('active'); else b.classList.remove('active'); });
}

function renderDishDetail(dish) {
  const months = ['J','F','M','A','M','J','J','A','S','O','N','D'];
  const fullMonths = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];

  // Flavor bars
  const flavorBars = Object.entries(dish.flavor_profile).map(([key, val]) => {
    const f = FLAVORS[key];
    return `
      <div class="flavor-bar-item">
        <div class="flavor-bar-label">${f.label}</div>
        <div class="flavor-bar-track">
          <div class="flavor-bar-fill" style="width:${val*10}%;background:${f.color}"></div>
        </div>
      </div>
    `;
  }).join('');

  // Seasonal
  const seasonBlocks = months.map((m, i) => {
    const on = dish.season[i];
    return `<div class="month-block" style="background:${on ? '#2d5a3d' : 'var(--parch2)'};" title="${fullMonths[i]}">
      <span class="month-block-label">${m}</span>
    </div>`;
  }).join('');

  // Ingredients
  const ingredientCards = dish.ingredients.map(ing => `
    <div class="ingredient-card">
      <div class="ingredient-icon">${ing.icon}</div>
      <div>
        <div class="ingredient-name">${ing.name}</div>
        <div class="ingredient-meta">Origin: ${ing.origin}<br>Season: ${ing.season}</div>
        ${ing.endemic ? `<span class="ingredient-endemic">Endemic / Region-specific</span>` : ''}
        <div class="ingredient-meta mt-8" style="font-style:italic">${ing.note}</div>
      </div>
    </div>
  `).join('');

  // Communities
  const communityCards = dish.communities.map(c => `
    <div class="community-card">
      <div>
        <div class="community-name">${c.name}</div>
        <div class="community-detail">${c.detail}</div>
      </div>
      <div style="text-align:center;min-width:60px;">
        <div class="tradition-score">${c.score}</div>
        <div class="tradition-label">Tradition<br>Index</div>
      </div>
    </div>
  `).join('');

  // Matches
  const matchCards = dish.matches.map(m => {
    const matched = DISHES.find(d => d.id === m.id);
    if (!matched) return '';
    const topFlavors = Object.entries(matched.flavor_profile).sort((a,b)=>b[1]-a[1]).slice(0,3);
    return `
      <div class="match-card" onclick="selectDish('${matched.id}')">
        <div class="match-score">${m.score}<span class="match-pct">%</span></div>
        <div class="match-dish">${matched.name}</div>
        <div class="match-region-tag">${matched.region}</div>
        <div class="match-reason">${m.reasons.join(' · ')}</div>
        <div class="match-flavors">
          ${topFlavors.map(([f]) => `<span class="match-flavor-tag">${FLAVORS[f].label}</span>`).join('')}
        </div>
      </div>
    `;
  }).join('');

  document.getElementById('dishDetail').innerHTML = `
    <div class="detail-hero">
      <div class="breadcrumb">${dish.cluster} → ${dish.region}</div>
      <h1 class="detail-title">${dish.name}</h1>
      <p class="detail-subtitle">${dish.local_name}</p>
      <div class="detail-tags">
        <span class="tag">${dish.origin_period}</span>
        <span class="tag">${dish.preparation_method}</span>
        <span class="tag">${dish.ingredients.length} Key Ingredients</span>
        <span class="tag">${dish.communities.length} Traditional Communities</span>
      </div>
    </div>

    <div class="detail-body">
      <div class="detail-grid">
        <div>
          <div class="section-label">Historical Origins</div>
          <p class="history-text">${dish.history}</p>
        </div>
        <div>
          <div class="info-card">
            <div class="info-row">
              <span class="info-key">Region</span>
              <span class="info-val">${dish.region}</span>
            </div>
            <div class="info-row">
              <span class="info-key">Cluster</span>
              <span class="info-val">${dish.cluster}</span>
            </div>
            <div class="info-row">
              <span class="info-key">Origin Period</span>
              <span class="info-val">${dish.origin_period}</span>
            </div>
            <div class="info-row">
              <span class="info-key">Method</span>
              <span class="info-val">${dish.preparation_method}</span>
            </div>
            <div class="info-row">
              <span class="info-key">Peak Season</span>
              <span class="info-val">${dish.season_notes.split(';')[0]}</span>
            </div>
          </div>
        </div>
      </div>

      <div class="flavor-section">
        <div class="section-label">Flavor Profile</div>
        <div class="flavor-grid">${flavorBars}</div>
      </div>

      <div class="seasonal-wrap">
        <div class="section-label">Seasonal Availability</div>
        <div class="seasonal-bar">${seasonBlocks}</div>
      </div>

      <div class="mt-32">
        <div class="section-label">Indigenous & Key Ingredients</div>
        <div class="ingredients-grid">${ingredientCards}</div>
      </div>

      <div>
        <div class="section-label">Traditional Communities</div>
        <div class="communities-list">${communityCards}</div>
      </div>

      <div class="match-section">
        <div class="match-header">
          <div>
            <div class="match-title">Culinary Connections</div>
            <div class="match-subtitle">Dishes sharing flavor architecture, technique lineage, or ingredient heritage → click to explore</div>
          </div>
        </div>
        <div class="match-cards">${matchCards}</div>
      </div>
    </div>
  `;
}

// ── REGIONS ───────────────────────────────────────────────────────────────

function renderRegionGrid() {
  const clusterColors = { 'Northern Luzon': '#b84a20', 'Central Luzon': '#8a3a70', 'Southern Luzon': '#c83030', 'Visayas': '#c8882a', 'Mindanao': '#1e4a6e' };
  document.getElementById('regionGrid').innerHTML = REGIONS.map(r => `
    <div class="region-card" style="border-top-color:${r.color}" onclick="exploreRegion('${r.id}')">
      <div class="region-name">${r.name}</div>
      <div class="region-cluster" style="color:${r.color}">${r.cluster}</div>
      <p style="font-size:0.72rem;color:var(--smoke);margin-bottom:14px;line-height:1.6;">${r.desc}</p>
      <div class="region-stats">
        <div class="region-stat"><strong>${r.dishes}</strong>Dishes</div>
        <div class="region-stat"><strong>${r.ingredients}</strong>Ingredients</div>
        <div class="region-stat"><strong>${r.communities}</strong>Communities</div>
      </div>
    </div>
  `).join('');
}

function exploreRegion(id) {
  const region = REGIONS.find(r => r.id === id);
  // Show dishes from this region
  const matching = DISHES.filter(d => d.id.includes(id) ||
    (id === 'bicol' && d.cluster === 'Luzon' && d.region.toLowerCase().includes('bicol')) ||
    (id === 'ilocos' && d.region.toLowerCase().includes('ilocos')) ||
    (id === 'cebu' && d.region.toLowerCase().includes('cebu')) ||
    (id === 'sulu' && d.region.toLowerCase().includes('sulu')) ||
    (id === 'eastern_visayas' && d.region.toLowerCase().includes('eastern visayas')) ||
    (id === 'western_visayas' && d.cluster === 'Visayas')
  );
  if (matching.length) {
    selectDish(matching[0].id);
  }
}

// ── ITINERARY ─────────────────────────────────────────────────────────────

function toggleFlavor(btn) {
  btn.classList.toggle('active');
}

function generateItinerary() {
  const startRegion = document.getElementById('startRegion').value;
  const duration = parseInt(document.getElementById('tripDuration').value);
  const activeFlavors = Array.from(document.querySelectorAll('.flavor-toggle.active')).map(b => b.textContent);

  const itineraries = {
    bicol: {
      title: 'The Fire & Coconut Route',
      subtitle: 'Chasing the coconut-spice continuum from Bicol to the Visayas',
      flavors: activeFlavors,
      days: [
        { loc: 'Naga City, Bicol', region: 'Bicol Region', dishes: ['Laing', 'Bicol Express', 'Pinangat'], note: 'Start at Naga\'s morning market. The laing vendors at the central market represent four generations of Daraga family recipes. Ask for the version with smoked fish — rarer and older.' },
        { loc: 'Daraga, Albay', region: 'Bicol Region', dishes: ['Laing ng Daraga', 'Kinunot', 'Sinigang na Tulingan'], note: 'Daraga is the village considered the spiritual origin of laing. Mayon\'s slopes produce the taro leaves used here. Attend the morning cook if you can arrange it.' },
        { loc: 'Legazpi City', region: 'Bicol Region', dishes: ['Pili nut dishes', 'Pancit Bato', 'Guinataang Puso'], note: 'Pili nuts are endemic to Bicol — no other region has them in this form. The Legazpi market\'s pili vendors represent an agricultural heritage invisible to most visitors.' },
        { loc: 'Tacloban, Leyte', region: 'Eastern Visayas', dishes: ['Humba', 'Lechon de Leyte', 'Moron'], note: 'Cross into Visayas. Tacloban\'s humba is sweeter and more Chinese-influenced than Cebu\'s — the Hokkien trade route is more visible here. Public market for the authentic version.' },
        { loc: 'Bohol', region: 'Central Visayas', dishes: ['Bohol humba', 'Binagol', 'Sikwate'], note: 'Bohol\'s variant of humba adds banana blossom and uses local palm sugar. The result is noticeably more caramelized. Sikwate (native hot chocolate) is underrated as a culinary artifact.' },
        { loc: 'Cebu City', region: 'Central Visayas', dishes: ['Lechon Cebuano', 'Sutukil', 'La Paz Batchoy'], note: 'Arrive for lechon in Talisay. The lemongrass-stuffed Cebuano pig is the logical endpoint of the coconut-spice journey — same Malay substrate, different expression.' },
        { loc: 'Carcar City, Cebu', region: 'Central Visayas', dishes: ['Heritage lechon', 'Chicharon Cebu', 'Ampaw'], note: 'Final day: Carcar\'s older lechon tradition uses river stone fire pits that are disappearing. This is a disappearing technique worth documenting.' },
      ]
    },
    ilocos: {
      title: 'The Fermentation & Smoke Route',
      subtitle: 'Following the preservation cultures of the northern coastline',
      flavors: activeFlavors,
      days: [
        { loc: 'Vigan City, Ilocos Sur', region: 'Ilocos Region', dishes: ['Bagnet', 'Pinakbet', 'Longganisa de Vigan'], note: 'Vigan Heritage Village at dawn — the bagnet stalls open at 5am. Longganisa de Vigan is garlicky and sour, unlike any other sausage in the archipelago. The annatto-red color is characteristic.' },
        { loc: 'Laoag, Ilocos Norte', region: 'Ilocos Region', dishes: ['Ilocos empanada', 'Dinengdeng', 'Igado'], note: 'Ilocos empanada is a revelatory artifact — the orange shell is made from rice flour, the filling includes green papaya and Vigan longanisa. This is not Spanish. This is something else.' },
        { loc: 'Batac, Ilocos Norte', region: 'Ilocos Region', dishes: ['Batac bagnet', 'Bagoong Monamon', 'Poqui-poqui'], note: 'The bagnet here is cut thicker and boiled longer. The bagoong monamon (fermented anchovy paste) from Pangasinan completes the table. This pairing is the ancient Ilocano flavour code.' },
        { loc: 'Pangasinan', region: 'Central Luzon', dishes: ['Pigar-pigar', 'Kaleskes', 'Bangus preparations'], note: 'Cross into Pangasinan. Bonuan bangus (milkfish) from Dagupan is an indigenous aquaculture story — the fish pens here are centuries old. Every preparation reflects a different preservation logic.' },
        { loc: 'Pampanga', region: 'Central Luzon', dishes: ['Sisig', 'Kare-Kare', 'Morcon Kapampangan'], note: 'Pampanga\'s sisig at the original Angeles City spot — this was once considered waste meat, now it\'s a culinary icon. Kare-kare\'s oxtail and peanut sauce has pre-colonial roots in a dish called kari.' },
        { loc: 'San Fernando, Pampanga', region: 'Central Luzon', dishes: ['Tocino del Cielo', 'Tibok-tibok', 'Bringhe'], note: 'Bringhe — sticky rice and coconut milk wrapped in banana leaf — is the Kapampangan answer to paella, possibly adapted from a 17th century Spanish encounter. The indigenous technique predates the reference.' },
        { loc: 'Batangas', region: 'Southern Luzon', dishes: ['Lomi', 'Tawilis (freshwater sardine)', 'Goto Batangas'], note: 'Final stop. Taal Lake\'s tawilis is found nowhere else on Earth — the world\'s only known freshwater sardine. This is the definition of an endemic culinary heritage ingredient.' },
      ]
    },
    cebu: {
      title: 'The Trade Route Table',
      subtitle: 'From Cebu\'s port kitchen to the outer islands of Visayas',
      flavors: activeFlavors,
      days: [
        { loc: 'Talisay City, Cebu', region: 'Central Visayas', dishes: ['Lechon Cebuano', 'Puso hanging rice', 'Sutukil'], note: 'Talisay before 8am. The master lechon families have operated here since the 1940s. Ask how long the pig has been on the spit — traditionalists say minimum 5 hours.' },
        { loc: 'Carcar, Cebu', region: 'Central Visayas', dishes: ['Carcar lechon', 'Chicharon', 'Ampaw'], note: 'Carcar\'s older tradition is distinct — smaller pigs, longer roast, river stone fires. The skin-crackle has a different acoustic signature. Worth the 45-minute drive.' },
        { loc: 'Bohol', region: 'Central Visayas', dishes: ['Humba sa Bohol', 'Binagol', 'Sikwate'], note: 'The Hokkien trade fingerprint is deep in Bohol\'s humba. The local palm sugar here (panocha) creates a caramel depth that cane sugar simply can\'t replicate.' },
        { loc: 'Dumaguete, Negros Oriental', region: 'Central Visayas', dishes: ['Negros humba', 'Chicken inasal', 'Sans Rival'], note: 'Negros\'s version of humba uses muscovado sugar — a byproduct of the island\'s historic sugar industry. Dark, molassesy, and complex. Different substrate, same lineage.' },
        { loc: 'Iloilo City', region: 'Western Visayas', dishes: ['La Paz Batchoy', 'KBL (Kadyos, Baboy, Langka)', 'Pancit Molo'], note: 'Iloilo is the most underrated food city in the Philippines. Batchoy\'s Hokkien noodle base plus offal is the Chinese merchant table translated into Ilonggo soul food.' },
        { loc: 'Bacolod, Negros Occidental', region: 'Western Visayas', dishes: ['Chicken Inasal', 'Batchoy de Bacolod', 'Napoleones'], note: 'Chicken inasal\'s annatto-and-lemongrass marinade is Malay in substrate. Manokan Country at dusk is essential — 20+ stalls, no menus, everyone orders the same thing.' },
        { loc: 'Capiz', region: 'Western Visayas', dishes: ['Fresh seafood preparations', 'Kinilaw', 'Ginataang alimasag'], note: 'Capiz is the Seafood Capital. Kinilaw here — cured raw fish in coconut vinegar — is the oldest preparation in this itinerary, predating every Spanish adaptation by centuries.' },
      ]
    },
    davao: {
      title: 'The Mindanao Confluence',
      subtitle: 'Indigenous, Malay, and migrant foodways in the south',
      flavors: activeFlavors,
      days: [
        { loc: 'Davao City', region: 'Davao Region', dishes: ['Kinilaw na tuna', 'Durian desserts', 'Pomelo preparations'], note: 'Davao\'s tuna kinilaw uses Mindanao\'s endemic coconut vinegar varieties — the acid profile is different from anything in Luzon or Visayas. The fruit abundance here is extraordinary.' },
        { loc: 'Kidapawan, Cotabato', region: 'Central Mindanao', dishes: ['B\'laan indigenous preparations', 'Tinolang native chicken', 'Lagaw'], note: 'B\'laan and Manobo culinary traditions survive in the upland communities near Mt. Apo. This is the least-documented culinary heritage in the database — and the most endangered.' },
        { loc: 'General Santos', region: 'SOCCSKSARGEN', dishes: ['Yellow fin tuna preparations', 'Ginataang pagi', 'Kinilaw Gensan'], note: 'The tuna capital of the Philippines. Kinilaw here uses the freshest possible tuna — the market is 2km from the port. The preparation speed matters to the flavor.' },
        { loc: 'Cotabato City', region: 'Central Mindanao', dishes: ['Maguindanaon rendang', 'Tiula sapi', 'Palapa'], note: 'Maguindanaon cuisine represents the Malay cultural current that arrived before Spain. Palapa — the fermented chili-ginger condiment — is on every table. This is Mindanao\'s bagoong.' },
        { loc: 'Marawi / Lanao del Sur', region: 'Western Mindanao', dishes: ['Maranao palapa', 'Dinardaraan Maranao', 'Royal biryani'], note: 'Maranao cuisine\'s spice depth reflects sustained contact with Malacca and Brunei trade routes. This is the most intact pre-colonial culinary tradition in the Philippine archipelago.' },
        { loc: 'Zamboanga City', region: 'Western Mindanao', dishes: ['Curacha (spanner crab)', 'Tiyula itum (diaspora)', 'Knickerbocker'], note: 'Zamboanga is the Chavacano culture node — a Spanish creole language and a cuisne to match. Curacha in alavar sauce is the city\'s flagship: a Tausug royal crab preparation.' },
        { loc: 'Jolo, Sulu', region: 'Sulu Archipelago', dishes: ['Tiyula itum', 'Tiyula manuk', 'Satti'], note: 'The most significant culinary heritage site in this itinerary. Tiyula itum — black royal soup — has survived intact for 600 years. Arrange community access in advance.' },
      ]
    },
    pampanga: {
      title: 'The Culinary Capital Circuit',
      subtitle: 'Kapampangan mastery and the central Philippine food corridor',
      flavors: activeFlavors,
      days: [
        { loc: 'Angeles City, Pampanga', region: 'Central Luzon', dishes: ['Original Sisig', 'Lechon Kawali', 'Morcon'], note: 'Aling Lucing\'s original sisig location or its nearest legitimate heir. The dish was invented in the 1970s from offal — transformed into a global Philippine ambassador. Context matters.' },
        { loc: 'San Fernando, Pampanga', region: 'Central Luzon', dishes: ['Bringhe', 'Tibok-tibok', 'Kare-Kare'], note: 'Pampanga\'s kare-kare has pre-colonial roots in a curry-like preparation absorbed and transformed by Kapampangan cooks. The bagoong pairing is non-negotiable.' },
        { loc: 'Bataan', region: 'Central Luzon', dishes: ['Adobong talaba', 'Sinigang na hipon', 'Ensaladang pako'], note: 'Bataan\'s oyster tradition is under-documented. The pako (fern) salad is endemic cuisine — ferns prepared as greens is a pre-colonial mountain tradition adapted to coastal life.' },
        { loc: 'Batangas City', region: 'Southern Luzon', dishes: ['Lomi Batangas', 'Goto Batangas', 'Kapeng Barako'], note: 'Kapeng barako — the Liberica coffee of Batangas — is one of Southeast Asia\'s most endangered coffee heritage varieties. The bean has a completely different flavor profile from arabica.' },
        { loc: 'Quezon Province', region: 'Southern Luzon', dishes: ['Pahimis', 'Lucban longganisa', 'Pancit Habhab'], note: 'Lucban longganisa is made with oregano — a distinctly Mediterranean herb absorbed into Philippine charcuterie during the Spanish period. Pahimis (shrimp paste dish) is the local version of bagoong.' },
        { loc: 'Rizal / Manila outskirts', region: 'NCR / CALABARZON', dishes: ['Spit-roast litson', 'Kilawin kalabaw', 'Nilagang baka'], note: 'Rizal\'s riverside restaurants serve kilawin kalabaw — carabao kinilaw — that almost no one documents. The carabao, as the working animal of rice agriculture, appears relatively rarely at the table; this is a significant cultural artifact.' },
        { loc: 'Intramuros / Manila', region: 'NCR', dishes: ['Arroz caldo', 'Escabeche', 'Paella Filipina'], note: 'End in Manila\'s Intramuros. The Spanish colonial kitchen — paella filipina, escabeche, arroz caldo — is itself a culinary heritage object: 300 years of adaptation showing how colonized cuisine absorbs and transforms the colonizer\'s table.' },
      ]
    },
    mindanao_west: {
      title: 'The Sultanate Table',
      subtitle: 'Tracing the Malay culinary substrate from Lanao to Sulu',
      flavors: activeFlavors,
      days: [
        { loc: 'Iligan City', region: 'Northern Mindanao', dishes: ['Maranao dishes', 'Fresh seafood', 'Tinutuang manok'], note: 'Gateway to the Lake Lanao basin. The Maranao culinary tradition — palapa, piaparan, rendang — is the most intact pre-colonial food culture in the country.' },
        { loc: 'Marawi City', region: 'Western Mindanao', dishes: ['Piaparan manok', 'Palapa', 'Tinapay Maranao'], note: 'Piaparan — chicken cooked in toasted coconut and spices — represents a direct culinary lineage from Malaccan court cuisine. The toasted coconut technique is also found in tiyula itum. Same substrate, different expression.' },
        { loc: 'Cotabato City', region: 'Central Mindanao', dishes: ['Maguindanaon rendang', 'Palapa rice', 'Tiula sapi'], note: 'Maguindanaon rendang predates the introduction of coconut milk reduction in other parts of Southeast Asia — an argument that this technique traveled from Mindanao outward, not the reverse.' },
        { loc: 'Zamboanga City', region: 'Zamboanga Peninsula', dishes: ['Curacha in alavar', 'Satti', 'Chavacano dishes'], note: 'Curacha (spanner crab) exists nowhere else in the Philippine culinary lexicon. Alavar sauce — coconut milk, palapa, and spices — is a private recipe of the Alavar family, known since the 1950s.' },
        { loc: 'Tawi-Tawi / Bongao', region: 'Sulu Archipelago', dishes: ['Pais na sapi', 'Tiyula manuk', 'Sea urchin'], note: 'Bongao\'s floating market is the most remarkable food scene in the southern Philippines. Bajau Laut communities prepare seafood in the Malay tradition — no fire, no utensils, absolute freshness.' },
        { loc: 'Jolo, Sulu', region: 'Sulu Archipelago', dishes: ['Tiyula itum', 'Satti', 'Pyaggau'], note: 'The endpoint: tiyula itum at its source. Six hundred years old, essentially unchanged. Requires advance arrangements through the community. This is what culinary heritage preservation means.' },
        { loc: 'Siasi, Sulu', region: 'Sulu Archipelago', dishes: ['Bajau seafood traditions', 'Panggi', 'Smoked fish heritage'], note: 'Bajau Laut communities of the Siasi islands maintain the oldest seafood preservation traditions in the archipelago. Smoked and sun-dried preparations unchanged since the 13th century.' },
      ]
    }
  };

  const itinerary = itineraries[startRegion] || itineraries['bicol'];
  const days = itinerary.days.slice(0, duration === 7 ? 7 : duration === 10 ? 7 : 7);

  const output = document.getElementById('itineraryOutput');
  output.innerHTML = `
    <div class="itinerary-header">
      <div>
        <h2 class="itinerary-title">${itinerary.title}</h2>
        <div class="itinerary-meta">${duration} days · Flavor affinities: ${activeFlavors.join(', ')} · ${days.length} destinations</div>
      </div>
    </div>
    <div class="route-days">
      ${days.map((day, i) => `
        <div class="route-day">
          <div class="route-day-num">
            <span class="day-n">${String(i+1).padStart(2,'0')}</span>
            <span class="day-label">Day</span>
            <div class="route-day-dot"></div>
          </div>
          <div class="route-day-content">
            <div class="route-location">${day.loc}</div>
            <div class="route-region-tag">${day.region}</div>
            <div class="route-dishes">
              ${day.dishes.map(d => `<span class="route-dish-pill">${d}</span>`).join('')}
            </div>
            <p class="route-note">${day.note}</p>
          </div>
        </div>
      `).join('')}
    </div>
  `;
  output.classList.add('visible');
  output.scrollIntoView({ behavior: 'smooth', block: 'start' });
}
